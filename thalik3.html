<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .menu-item button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .menu-item button:hover {
            background-color: #e64a19;
        }
        .cart-section {
            margin-top: 30px;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
        }
        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .checkout-form input, .checkout-form textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .checkout-form button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .checkout-form button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍔 QuickBites Menu</h1>
    
    <!-- Menu Section -->
    <div id="menu-container">
        <!-- Menu items will be injected here by JavaScript -->
    </div>

    <!-- Cart and Checkout Section -->
    <div class="cart-section">
        <h2>Your Cart</h2>
        <ul id="cart-items">
            <li>No items in cart yet.</li>
        </ul>
        <h3>Total: ₹<span id="total-price">0</span></h3>

        <h2>Checkout</h2>
        <form class="checkout-form" id="order-form">
            <input type="text" id="customer-name" placeholder="Enter your Name" required>
            <textarea id="customer-address" placeholder="Enter Delivery Address" rows="3" required></textarea>
            <button type="submit">Place Order</button>
        </form>
    </div>
</div>

<script>
    // 1. Define the Menu Data
    const menu = [
        { id: 1, name: "Margherita Pizza", price: 299 },
        { id: 2, name: "Veg Burger", price: 149 },
        { id: 3, name: "Pasta Alfredo", price: 249 },
        { id: 4, name: "Cold Coffee", price: 99 }
    ];

    let cart = [];

    // 2. Display the Menu on the Page
    const menuContainer = document.getElementById('menu-container');
    
    menu.forEach(item => {
        const div = document.createElement('div');
        div.className = 'menu-item';
        div.innerHTML = `
            <span><strong>${item.name}</strong> - ₹${item.price}</span>
            <button onclick="addToCart(${item.id})">Add to Cart</button>
        `;
        menuContainer.appendChild(div);
    });

    // 3. Add Items to Cart
    function addToCart(itemId) {
        const selectedItem = menu.find(item => item.id === itemId);
        cart.push(selectedItem);
        updateCartDisplay();
    }

    // 4. Update the Cart UI
    function updateCartDisplay() {
        const cartList = document.getElementById('cart-items');
        const totalPriceElement = document.getElementById('total-price');
        
        cartList.innerHTML = ''; // Clear current list
        let total = 0;

        if (cart.length === 0) {
            cartList.innerHTML = '<li>No items in cart yet.</li>';
        } else {
            cart.forEach((item, index) => {
                total += item.price;
                const li = document.createElement('li');
                li.textContent = `${item.name} - ₹${item.price}`;
                cartList.appendChild(li);
            });
        }
        
        totalPriceElement.textContent = total;
    }

    // 5. Handle Form Submission (Placing the order)
    document.getElementById('order-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent page reload
        
        if (cart.length === 0) {
            alert("Your cart is empty! Please add items before placing an order.");
            return;
        }

        const name = document.getElementById('customer-name').value;
        const totalAmount = document.getElementById('total-price').textContent;

        // In a real app, you would use fetch() here to send 'cart' and 'name' to the Node.js backend.
        alert(`Order Confirmed!\nThank you, ${name}. Your total bill is ₹${totalAmount}. Your food is being prepared.`);
        
        // Clear form and cart after successful order
        cart = [];
        updateCartDisplay();
        this.reset();
    });
</script>

</body>
</html>
